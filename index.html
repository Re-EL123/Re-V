<script>

    "A Project Management Professional With PMP Certification And Proven Delivery Records."

  const aboutDatalist = document.getElementById('aboutList');
  aboutMeList.forEach(text => {
    const option = document.createElement('option');
    option.value = text;
    aboutDatalist.appendChild(option);
  });

  // ---------- helpers ----------

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function capitalizeWords(str) {
    return String(str ?? '').replace(/\b\w/g, c => c.toUpperCase());
  }

  // ---------- repeatable field rows ----------

  const FIELD_CONFIG = {
    education: [
      { key: 'institution', placeholder: 'Institution Name', tag: 'input' },
      { key: 'qualification', placeholder: 'Qualification', tag: 'input' },
      { key: 'year', placeholder: 'Year Completed', tag: 'input' }
    ],
    experience: [
      { key: 'company', placeholder: 'Company Name', tag: 'input' },
      { key: 'position', placeholder: 'Position', tag: 'input' },
      { key: 'duties', placeholder: 'Duties', tag: 'textarea' },
      { key: 'reference', placeholder: 'Reference Contact', tag: 'input' }
    ],
    skills: [
      { key: 'skill', placeholder: 'Skill', tag: 'input' }
    ]
  };

  function addField(type, values) {
    const section = document.getElementById(`${type}-section`);
    const div = document.createElement('div');
    div.className = 'field';
    div.dataset.rowType = type;

    FIELD_CONFIG[type].forEach(f => {
      const el = document.createElement(f.tag);
      el.setAttribute('placeholder', f.placeholder);
      el.setAttribute('aria-label', f.placeholder);
      el.dataset.field = f.key;
      if (values && values[f.key] !== undefined) el.value = values[f.key];
      div.appendChild(el);
    });

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.textContent = 'Remove';
    removeBtn.setAttribute('aria-label', `Remove this ${type} entry`);
    removeBtn.onclick = () => div.remove();
    div.appendChild(removeBtn);

    section.appendChild(div);
    return div;
  }

  function readRows(type) {
    const rows = [];
    document.querySelectorAll(`#${type}-section .field`).forEach(div => {
      const row = {};
      FIELD_CONFIG[type].forEach(f => {
        const el = div.querySelector(`[data-field="${f.key}"]`);
        row[f.key] = el ? el.value.trim() : '';
      });
      const hasContent = Object.values(row).some(v => v !== '');
      if (hasContent) rows.push(row);
    });
    return rows;
  }

  // ---------- data model (single source of truth for save/load/generate) ----------

  function collectFormData() {
    return {
      name: document.getElementById('name').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim(),
      address: document.getElementById('address').value.trim(),
      about: document.getElementById('about').value.trim(),
      theme: document.getElementById('theme').value,
      education: readRows('education'),
      experience: readRows('experience'),
      skills: readRows('skills').map(r => r.skill)
    };
  }

  function renderFormData(data) {
    document.getElementById('name').value = data.name || '';
    document.getElementById('phone').value = data.phone || '';
    document.getElementById('email').value = data.email || '';
    document.getElementById('address').value = data.address || '';
    document.getElementById('about').value = data.about || '';
    document.getElementById('theme').value = data.theme || 'theme-1';

    ['education', 'experience', 'skills'].forEach(type => {
      const section = document.getElementById(`${type}-section`);
      section.querySelectorAll('.field').forEach(el => el.remove());
    });

    (data.education || []).forEach(row => addField('education', row));
    (data.experience || []).forEach(row => addField('experience', row));
    (data.skills || []).forEach(skill => addField('skills', { skill }));
  }

  // ---------- on-screen preview (theme-styled, HTML-escaped) ----------

  function generateCV() {
    const data = collectFormData();
    if (!data.name) return alert('Please enter your name.');

    const name = capitalizeWords(data.name);
    const address = capitalizeWords(data.address);
    const about = capitalizeWords(data.about) || capitalizeWords(aboutMeList[Math.floor(Math.random() * aboutMeList.length)]);

    let eduHTML = '';
    data.education.forEach(row => {
      eduHTML += `<p>${escapeHtml(capitalizeWords(row.institution))} — ${escapeHtml(capitalizeWords(row.qualification))} (${escapeHtml(row.year)})</p>`;
    });

    let expHTML = '';
    data.experience.forEach(row => {
      expHTML += `<p><strong>${escapeHtml(capitalizeWords(row.company))}</strong> — ${escapeHtml(capitalizeWords(row.position))}<br/>${escapeHtml(capitalizeWords(row.duties)).replace(/\n/g, '<br/>')}<br/><em>Reference:</em> ${escapeHtml(row.reference)}</p>`;
    });

    let skillHTML = '';
    data.skills.forEach(skill => {
      skillHTML += `<li>${escapeHtml(capitalizeWords(skill))}</li>`;
    });

    const preview = document.getElementById('cv-preview');
    preview.className = `cv-preview ${data.theme}`;
    preview.innerHTML = `
      <div class="cv-heading">Curriculum Vitae</div>
      <h2>${escapeHtml(name)}</h2>
      <p><strong>Phone:</strong> ${escapeHtml(data.phone)}</p>
      <p><strong>Email:</strong> ${escapeHtml(data.email)}</p>
      <p><strong>Address:</strong> ${escapeHtml(address)}</p>
      <p><strong>About Me:</strong> ${escapeHtml(about)}</p>
      <h3>Education</h3>${eduHTML}
      <h3>Experience</h3>${expHTML}
      <h3>Skills</h3><ul>${skillHTML}</ul>
      <div class="watermark">Created on www.re-el-branding.rf.gd</div>
    `;
    preview.classList.remove('hidden');
    document.getElementById('downloadBtn').classList.remove('hidden');
    document.getElementById('shareBtn').classList.remove('hidden');
  }

  // ---------- ATS-friendly PDF (real selectable text, single column, standard font) ----------

  function generateAtsPdf(data) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'pt', format: 'a4' });

    const marginX = 48;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const maxWidth = pageWidth - marginX * 2;
    let y = 56;

    function ensureSpace(lineHeight) {
      if (y + lineHeight > pageHeight - 48) {
        doc.addPage();
        y = 56;
      }
    }

    function writeLine(text, { size = 11, style = 'normal', gapAfter = 14 } = {}) {
      doc.setFont('helvetica', style);
      doc.setFontSize(size);
      const lines = doc.splitTextToSize(text, maxWidth);
      lines.forEach(line => {
        ensureSpace(size + 4);
        doc.text(line, marginX, y);
        y += size + 4;
      });
      y += gapAfter - (size + 4);
      if (y < 0) y = 0;
    }

    function sectionHeading(text) {
      y += 6;
      ensureSpace(20);
      doc.setDrawColor(180);
      doc.setLineWidth(0.5);
      doc.line(marginX, y, pageWidth - marginX, y);
      y += 14;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text(text.toUpperCase(), marginX, y);
      y += 14;
    }

    // Name (largest text on the page — helps ATS and humans find it first)
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(20);
    doc.text(capitalizeWords(data.name) || 'Full Name', marginX, y);
    y += 24;

    // Contact line — plain text, pipe-separated (no icons/tables, which some ATS can't parse)
    const contactParts = [data.phone, data.email, data.address].filter(Boolean);
    if (contactParts.length) {
      writeLine(contactParts.join('  |  '), { size: 10, gapAfter: 18 });
    }

    if (data.about) {
      sectionHeading('Professional Summary');
      writeLine(capitalizeWords(data.about), { size: 10.5, gapAfter: 8 });
    }

    if (data.experience.length) {
      sectionHeading('Experience');
      data.experience.forEach(row => {
        writeLine(`${capitalizeWords(row.company)} — ${capitalizeWords(row.position)}`, { size: 11, style: 'bold', gapAfter: 4 });
        if (row.duties) {
          row.duties.split('\n').filter(Boolean).forEach(line => {
            writeLine(`- ${capitalizeWords(line.trim())}`, { size: 10.5, gapAfter: 2 });
          });
        }
        if (row.reference) {
          writeLine(`Reference: ${row.reference}`, { size: 9.5, gapAfter: 12 });
        } else {
          y += 8;
        }
      });
    }

    if (data.education.length) {
      sectionHeading('Education');
      data.education.forEach(row => {
        writeLine(`${capitalizeWords(row.institution)} — ${capitalizeWords(row.qualification)} (${row.year})`, { size: 10.5, gapAfter: 8 });
      });
    }

    if (data.skills.length) {
      sectionHeading('Skills');
      writeLine(data.skills.map(capitalizeWords).join(', '), { size: 10.5, gapAfter: 8 });
    }

    // Plain text footer — safe for ATS since it's real text, not a graphic watermark
    ensureSpace(20);
    doc.setFont('helvetica', 'italic');
    doc.setFontSize(8);
    doc.setTextColor(140);
    doc.text('Created on www.re-el-branding.rf.gd', marginX, pageHeight - 30);

    return doc;
  }

  function downloadCV() {
    const data = collectFormData();
    if (!data.name) return alert('Please enter your name.');
    const doc = generateAtsPdf(data);
    const safeName = (capitalizeWords(data.name) || 'CV').replace(/[^\w\- ]/g, '').trim().replace(/\s+/g, '_');
    doc.save(`${safeName}_CV.pdf`);
  }

  function shareCV() {
    alert('Use your browser share feature or send the downloaded PDF to share it.');
  }

  // ---------- structured save/load (JSON, not raw HTML) ----------

  function saveData() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(collectFormData()));
      alert('Your data has been saved locally.');
    } catch (err) {
      console.error(err);
      alert('Could not save your data (your browser may be blocking local storage).');
    }
  }

  function loadData() {
    let raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      console.error(err);
      alert('Could not access local storage.');
      return;
    }
    if (!raw) return alert('No saved data found.');
    try {
      renderFormData(JSON.parse(raw));
      alert('Your saved data has been loaded.');
    } catch (err) {
      console.error(err);
      alert('Saved data was corrupted and could not be loaded.');
    }
  }
</script>
